name: CI

env:
   HUSKY: 0

on:
   push:
      branches: [main]
   pull_request:
   schedule:
      # Weekly, for the newest-effect job: `effect/reactivity` is unstable, so
      # a new Effect 4.x release can break us without anything being pushed.
      - cron: "0 6 * * 1"
   workflow_dispatch:

permissions:
   contents: read

concurrency:
   group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
   cancel-in-progress: true

jobs:
   check:
      if: github.event_name != 'schedule'
      runs-on: ubuntu-latest
      timeout-minutes: 10
      steps:
         - name: Check out repository
           uses: actions/checkout@v7

         - name: Set up pnpm
           uses: pnpm/action-setup@v6

         - name: Set up Node.js
           uses: actions/setup-node@v7
           with:
              node-version-file: .nvmrc
              cache: pnpm

         - name: Install dependencies
           run: pnpm install --frozen-lockfile

         - name: Build and test
           run: pnpm run check

   oldest-peers:
      name: check (oldest supported effect)
      if: github.event_name != 'schedule'
      runs-on: ubuntu-latest
      timeout-minutes: 10
      steps:
         - name: Check out repository
           uses: actions/checkout@v7

         - name: Set up pnpm
           uses: pnpm/action-setup@v6

         - name: Set up Node.js
           uses: actions/setup-node@v7
           with:
              node-version-file: .nvmrc
              cache: pnpm

         - name: Install dependencies
           run: pnpm install --frozen-lockfile

         - name: Install oldest supported effect
           run: pnpm add --save-dev --save-exact effect@4.1.0 @effect/atom-react@4.1.0 @effect/vitest@4.1.0

         - name: Build and test
           run: pnpm run typecheck && pnpm run check:docs && pnpm test && pnpm run build && pnpm run smoke

   newest-effect:
      name: check (newest effect 4.x)
      runs-on: ubuntu-latest
      timeout-minutes: 10
      steps:
         - name: Check out repository
           uses: actions/checkout@v7

         - name: Set up pnpm
           uses: pnpm/action-setup@v6

         - name: Set up Node.js
           uses: actions/setup-node@v7
           with:
              node-version-file: .nvmrc
              cache: pnpm

         - name: Install dependencies
           run: pnpm install --frozen-lockfile

         # Removed first: `pnpm add` keeps a locked version that satisfies the
         # range, so adding `effect@^4` over the locked 4.1.0 is a no-op.
         - name: Install newest effect 4.x
           run: |
              pnpm remove effect @effect/atom-react @effect/vitest
              pnpm add --save-dev effect@^4 @effect/atom-react@^4 @effect/vitest@^4
              pnpm list effect @effect/atom-react @effect/vitest

         - name: Build and test
           run: pnpm run typecheck && pnpm run check:docs && pnpm test && pnpm run build && pnpm run smoke
